rules:
  - id: secrets-hardcoded-password
    patterns:
      - pattern: password = "..."
      - pattern: PASSWORD = "..."
      - pattern: passwd = "..."
    message: >
      Hardcoded password detected. Store secrets in environment
      variables or a secrets manager.
    languages: [python, javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-798"

  - id: secrets-hardcoded-api-key
    patterns:
      - pattern: api_key = "..."
      - pattern: API_KEY = "..."
      - pattern: apiKey = "..."
    message: >
      Hardcoded API key detected. Use environment variables or a
      secrets manager to store API keys.
    languages: [python, javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-798"

  - id: secrets-hardcoded-secret
    patterns:
      - pattern: secret = "..."
      - pattern: SECRET = "..."
      - pattern: secret_key = "..."
      - pattern: SECRET_KEY = "..."
    message: >
      Hardcoded secret detected. Use environment variables or a
      secrets manager.
    languages: [python, javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-798"

  - id: secrets-hardcoded-token
    patterns:
      - pattern: token = "..."
      - pattern: TOKEN = "..."
      - pattern: access_token = "..."
      - pattern: ACCESS_TOKEN = "..."
    message: >
      Hardcoded token detected. Tokens should be loaded from
      environment variables or a secure vault at runtime.
    languages: [python, javascript, typescript]
    severity: WARNING
    metadata:
      cwe: "CWE-798"

  - id: secrets-private-key-inline
    pattern-regex: '-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----'
    message: >
      Private key embedded in source code. Store private keys in
      files excluded from version control or use a key management service.
    languages: [generic]
    severity: ERROR
    metadata:
      cwe: "CWE-321"
